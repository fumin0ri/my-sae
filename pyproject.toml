[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-residual"
version = "0.20.0"
description = "Train dense Rectified LpJEPA candidates with Top-K high/low SAE reconstruction codes"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.30",
  "datasets>=2.20,<4",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "torch>=2.5,<3",
  "tqdm>=4.66",
  "transformers>=4.44",
  "zstandard>=0.22",
]

[project.optional-dependencies]
sae = ["sae-lens>=6.0", "transformer-lens>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
sr-extract = "shared_residual.extract:main"
sr-extract-grid = "shared_residual.extract_grid:main"
sr-extract-pile = "shared_residual.pile_extract:main"
sr-make-mmlu = "shared_residual.mmlu_data:main"
sr-score-mmlu = "shared_residual.mmlu_score:main"
sr-fit = "shared_residual.subspace:main"
sr-research = "shared_residual.research:main"
sr-sae = "shared_residual.sae_analysis:main"
sr-intervene = "shared_residual.intervene:main"
sr-train-group-sae = "shared_residual.group_sae:main"
sr-visualize = "shared_residual.visualize_results:main"
sr-train-rectified-lpjepa-sae = "shared_residual.rectified_lpjepa_sae:main"
sr-evaluate-rectified-lpjepa-sae = "shared_residual.rectified_lpjepa_eval:main"
sr-intervene-rectified-lpjepa-sae = "shared_residual.rectified_lpjepa_intervene:main"
sr-visualize-rectified-lpjepa-sae = "shared_residual.rectified_lpjepa_visualize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
